<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 5: Sumas Espaciales</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .mission-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .mission-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            margin-bottom: 30px;
        }

        .game-card {
            padding: 30px;
            text-align: center;
            border-radius: 20px;
        }

        .problem-display {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 25px 0;
            letter-spacing: 2px;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .btn-option {
            padding: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-option:hover {
            background: rgba(0, 240, 255, 0.2);
            border-color: #00f0ff;
            transform: scale(1.03);
        }

        .btn-secondary-space {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .feedback {
            margin-top: 20px;
            font-size: 1.2rem;
            min-height: 30px;
            font-weight: bold;
        }

        .correct { color: #00ff88; }
        .incorrect { color: #ff4757; }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    <div id="stars2-container"></div>

    <div class="app-container mission-container">
        
        <!-- Header de la Misión -->
        <header class="glassmorphism mission-header">
            <button class="btn-secondary-space" onclick="window.location.href='map.html'">🗺️ Volver al Mapa</button>
            <div class="user-pill">🚀 Misión 5: Sumas Espaciales</div>
            <div class="stat-pill">⭐ Estrellas: <span id="stars-count">0</span></div>
        </header>

        <!-- Tarjeta del Juego -->
        <div class="glassmorphism game-card" id="game-card">
            <h2>Calcula la suma espacial 🌌</h2>
            <p style="color: rgba(255, 255, 255, 0.7);">Resuelve los ejercicios para cargar la energía de la nave.</p>

            <div class="problem-display" id="problem">0 + 0</div>

            <div class="options-grid" id="options">
                <!-- Se generan dinámicamente -->
            </div>

            <div class="feedback" id="feedback"></div>
        </div>

    </div>

    <script>
        const MISSION_ID = 5;
        let num1 = 0;
        let num2 = 0;
        let respuestaCorrecta = 0;
        let racha = 0;
        const totalParaGanar = 5; // Cantidad de sumas correctas para ganar
        let gameState = { stars: 0, completedMissions: [], unlockedMissions: [1] };

        // Cargar progreso del juego
        function cargarEstado() {
            try {
                const saved = localStorage.getItem("GAME_STATE") || localStorage.getItem("MISION_ESPACIAL_DATA");
                if (saved) {
                    gameState = JSON.parse(saved);
                }
            } catch(e) {}
            document.getElementById("stars-count").textContent = gameState.stars || 0;
        }

        // Generar un nuevo problema de suma
        function generarProblema() {
            document.getElementById("feedback").textContent = "";
            num1 = Math.floor(Math.random() * 20) + 1;
            num2 = Math.floor(Math.random() * 20) + 1;
            respuestaCorrecta = num1 + num2;

            document.getElementById("problem").textContent = `${num1} + ${num2}`;

            // Crear opciones (1 correcta y 3 falsas)
            let opciones = new Set([respuestaCorrecta]);
            while (opciones.size < 4) {
                let desvio = Math.floor(Math.random() * 7) - 3;
                let opcionFalsa = respuestaCorrecta + desvio;
                if (opcionFalsa > 0 && opcionFalsa !== respuestaCorrecta) {
                    opciones.add(opcionFalsa);
                }
            }

            // Mezclar opciones
            const opcionesArray = Array.from(opciones).sort(() => Math.random() - 0.5);

            const container = document.getElementById("options");
            container.innerHTML = "";
            opcionesArray.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "btn-option";
                btn.textContent = opt;
                btn.onclick = () => verificarRespuesta(opt);
                container.appendChild(btn);
            });
        }

        // Validar la respuesta dada por el usuario
        function verificarRespuesta(seleccion) {
            const feedbackEl = document.getElementById("feedback");

            if (seleccion === respuestaCorrecta) {
                racha++;
                gameState.stars = (gameState.stars || 0) + 5;
                document.getElementById("stars-count").textContent = gameState.stars;
                feedbackEl.className = "feedback correct";
                feedbackEl.textContent = `¡Excelente! 🚀 (${racha}/${totalParaGanar})`;

                if (racha >= totalParaGanar) {
                    completarMision();
                } else {
                    setTimeout(generarProblema, 1200);
                }
            } else {
                feedbackEl.className = "feedback incorrect";
                feedbackEl.textContent = "¡Casi! Inténtalo de nuevo. ☄️";
            }
        }

        // Guardar progreso y regresar al mapa
        function completarMision() {
            if (!gameState.completedMissions.includes(MISSION_ID)) {
                gameState.completedMissions.push(MISSION_ID);
            }
            // Desbloquear la Misión 6
            if (!gameState.unlockedMissions.includes(6)) {
                gameState.unlockedMissions.push(6);
            }

            // Guardar en ambas llaves para evitar discrepancias
            localStorage.setItem("GAME_STATE", JSON.stringify(gameState));
            localStorage.setItem("MISION_ESPACIAL_DATA", JSON.stringify(gameState));

            const card = document.getElementById("game-card");
            card.innerHTML = `
                <h1 style="font-size: 3rem; margin-bottom: 15px;">🎉 ¡Misión 5 Completada! 🎉</h1>
                <p style="font-size: 1.2rem; margin-bottom: 25px;">Has dominado las Sumas Espaciales y desbloqueaste la Misión 6.</p>
                <button class="btn-option" style="background: linear-gradient(90deg, #00f0ff, #7b2cbf); width: 80%;" onclick="window.location.href='map.html'">
                    Volver al Mapa de Misiones 🚀
                </button>
            `;
        }

        cargarEstado();
        generarProblema();
    </script>
</body>
</html>
