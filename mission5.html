<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 5: Sumas Espaciales</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .mission-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .mission-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            margin-bottom: 25px;
        }

        .progress-bar-container {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
            border: 1px solid var(--glass-border);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary-cyan), var(--primary-violet));
            transition: width 0.4s ease;
            box-shadow: 0 0 10px var(--primary-cyan);
        }

        .game-card {
            padding: 30px;
            text-align: center;
            border-radius: 20px;
        }

        .problem-display {
            font-size: 3.5rem;
            font-weight: bold;
            margin: 25px 0;
            letter-spacing: 2px;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .btn-option {
            padding: 20px;
            font-size: 1.8rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-option:hover:not(:disabled) {
            background: rgba(0, 240, 255, 0.2);
            border-color: #00f0ff;
            transform: scale(1.03);
        }

        .btn-option:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .btn-secondary-space {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .feedback {
            margin-top: 20px;
            font-size: 1.2rem;
            min-height: 30px;
            font-weight: bold;
        }

        .correct { color: #00ff88; }
        .incorrect { color: #ff4757; }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    <div id="stars2-container"></div>

    <div class="app-container mission-container">
        
        <!-- Header de la Misión -->
        <header class="glassmorphism mission-header">
            <button id="btn-back" class="btn-secondary-space">⬅ Volver al Mapa</button>
            <div class="user-pill">🚀 Misión 5: Sumas Espaciales</div>
            <div class="stat-pill">⭐ <span id="stars-count">0</span></div>
        </header>

        <!-- Barra de Progreso -->
        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>

        <!-- Tarjeta del Juego -->
        <main class="glassmorphism game-card" id="game-card">
            <div class="planet-number" id="question-number">Paso 1 de 5</div>
            <h2>Calcula la suma espacial 🌌</h2>
            <p style="color: rgba(255, 255, 255, 0.7);">Resuelve las operaciones para cargar la energía de la nave.</p>

            <div class="problem-display" id="problem">0 + 0</div>

            <div class="options-grid" id="options">
                <!-- Se generan dinámicamente -->
            </div>

            <div class="feedback" id="feedback"></div>
        </main>

    </div>

    <script>
        const MISSION_ID = 5;
        let num1 = 0;
        let num2 = 0;
        let respuestaCorrecta = 0;
        let aciertos = 0;
        const totalParaGanar = 5;
        let estrellasGanadas = 0;
        let estrellasIniciales = 0;

        const elStarsCount = document.getElementById("stars-count");
        const elProgressFill = document.getElementById("progress-fill");
        const elQuestionNumber = document.getElementById("question-number");

        // Cargar estado inicial preservando todos los campos
        function cargarEstadoInicial() {
            try {
                const saved = localStorage.getItem("GAME_STATE") || localStorage.getItem("MISION_ESPACIAL_DATA");
                if (saved) {
                    const parsed = JSON.parse(saved);
                    estrellasIniciales = parsed.stars || 0;
                }
            } catch(e) {
                estrellasIniciales = 0;
            }
            actualizarMarcadorEstrellas();
        }

        function actualizarMarcadorEstrellas() {
            elStarsCount.textContent = estrellasIniciales + estrellasGanadas;
        }

        // Generar un nuevo problema de suma
        function generarProblema() {
            document.getElementById("feedback").textContent = "";
            
            // Actualizar número de paso y barra de progreso
            elQuestionNumber.textContent = `Paso ${aciertos + 1} de ${totalParaGanar}`;
            elProgressFill.style.width = `${(aciertos / totalParaGanar) * 100}%`;

            num1 = Math.floor(Math.random() * 20) + 1;
            num2 = Math.floor(Math.random() * 20) + 1;
            respuestaCorrecta = num1 + num2;

            document.getElementById("problem").textContent = `${num1} + ${num2}`;

            // Crear opciones (1 correcta y 3 falsas)
            let opciones = new Set([respuestaCorrecta]);
            while (opciones.size < 4) {
                let desvio = Math.floor(Math.random() * 7) - 3;
                let opcionFalsa = respuestaCorrecta + desvio;
                if (opcionFalsa > 0 && opcionFalsa !== respuestaCorrecta) {
                    opciones.add(opcionFalsa);
                }
            }

            const opcionesArray = Array.from(opciones).sort(() => Math.random() - 0.5);

            const container = document.getElementById("options");
            container.innerHTML = "";
            opcionesArray.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "btn-option";
                btn.textContent = opt;
                btn.onclick = () => verificarRespuesta(opt, btn);
                container.appendChild(btn);
            });
        }

        // Validar respuesta
        function verificarRespuesta(seleccion, boton) {
            const feedbackEl = document.getElementById("feedback");
            const todosBotones = document.querySelectorAll(".btn-option");

            if (seleccion === respuestaCorrecta) {
                todosBotones.forEach(b => b.disabled = true);
                
                aciertos++;
                estrellasGanadas++;
                actualizarMarcadorEstrellas();
                
                feedbackEl.className = "feedback correct";
                feedbackEl.textContent = "¡Excelente! 🚀 Suma correcta.";

                if (aciertos >= totalParaGanar) {
                    elProgressFill.style.width = "100%";
                    setTimeout(completarMision, 1000);
                } else {
                    setTimeout(generarProblema, 1000);
                }
            } else {
                boton.disabled = true;
                feedbackEl.className = "feedback incorrect";
                feedbackEl.textContent = "¡Casi! Revisa tu cálculo e inténtalo de nuevo. ☄️";
            }
        }

        // Guardar datos sin perder misiones desbloqueadas previamente
        function completarMision() {
            let data = { stars: 0, points: 0, completedMissions: [], unlockedMissions: [1] };
            
            try {
                const saved = localStorage.getItem("GAME_STATE") || localStorage.getItem("MISION_ESPACIAL_DATA");
                if (saved) {
                    data = Object.assign(data, JSON.parse(saved));
                }
            } catch(e) {}

            // Actualizar datos
            data.stars = (data.stars || 0) + estrellasGanadas;
            data.points = (data.points || 0) + (estrellasGanadas * 50);

            if (!data.completedMissions) data.completedMissions = [];
            if (!data.completedMissions.includes(MISSION_ID)) data.completedMissions.push(MISSION_ID);

            if (!data.unlockedMissions) data.unlockedMissions = [1];
            if (!data.unlockedMissions.includes(6)) data.unlockedMissions.push(6);

            // Guardar en ambas claves para garantizar compatibilidad
            const dataString = JSON.stringify(data);
            localStorage.setItem("GAME_STATE", dataString);
            localStorage.setItem("MISION_ESPACIAL_DATA", dataString);

            const card = document.getElementById("game-card");
            card.innerHTML = `
                <h1 style="font-size: 2.5rem; margin-bottom: 15px; color: #00ff88;">🎉 ¡Misión 5 Completada! 🎉</h1>
                <p style="font-size: 1.2rem; margin-bottom: 25px;">Has completado las sumas y desbloqueado la Misión 6.</p>
                <button class="btn-option" style="background: linear-gradient(90deg, #00f0ff, #7b2cbf); width: 80%; margin: 0 auto;" onclick="window.location.href='map.html'">
                    Volver al Mapa de Misiones 🚀
                </button>
            `;
        }

        document.getElementById("btn-back").addEventListener("click", () => {
            window.location.href = "map.html";
        });

        cargarEstadoInicial();
        generarProblema();
    </script>
</body>
</html>
