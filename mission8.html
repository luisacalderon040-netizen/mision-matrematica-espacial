<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 8: Multiplicaciones Espaciales</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .mission-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .mission-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px 25px;
        }

        .progress-bar-container {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff, #7b2cbf);
            transition: width 0.4s ease;
            box-shadow: 0 0 10px #00f0ff;
        }

        .question-card {
            padding: 30px;
            margin-bottom: 20px;
            text-align: center;
        }

        .problem-display {
            font-size: 3.2rem;
            font-weight: bold;
            margin: 20px 0;
            letter-spacing: 2px;
            color: #00f0ff;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 18px;
            border-radius: 14px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: rgba(0, 240, 255, 0.15);
            border-color: #00f0ff;
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .feedback-message {
            min-height: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            margin: 15px 0;
        }

        .feedback-correct { color: #00ff88; text-shadow: 0 0 8px rgba(0, 255, 136, 0.5); }
        .feedback-wrong { color: #ff4d4d; text-shadow: 0 0 8px rgba(255, 77, 77, 0.5); }

        .btn-secondary-space {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Fondo de Estrellas -->
    <div id="stars-container"></div>
    <div id="stars2-container"></div>

    <div class="app-container mission-container">
        
        <!-- Header de la Misión -->
        <header class="glassmorphism mission-header">
            <button id="btn-back" class="btn-secondary-space">🗺️ Volver al Mapa</button>
            <div class="user-pill">⚡ Misión 8: Multiplicaciones Espaciales</div>
            <div class="stat-pill">⭐ <span id="m-stars">0</span></div>
        </header>

        <!-- Barra de Progreso de la Misión -->
        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>

        <!-- Tarjeta del Ejercicio -->
        <main class="glassmorphism question-card">
            <div class="planet-number" id="question-number">Paso 1 de 5</div>
            <h2 style="margin-bottom: 10px;">Carga los hiperimpulsores 🚀</h2>
            <p style="color: rgba(255, 255, 255, 0.7);">Calcula el resultado de la multiplicación para activar los motores.</p>

            <div class="problem-display" id="problem">0 × 0</div>

            <div class="options-grid" id="options-container">
                <!-- Opciones dinámicas -->
            </div>

            <div class="feedback-message" id="feedback"></div>
        </main>

    </div>

    <script>
        const MISSION_ID = 8;
        let num1 = 0;
        let num2 = 0;
        let respuestaCorrecta = 0;
        let aciertos = 0;
        const totalParaGanar = 5;
        let estrellasGanadas = 0;

        const elPreguntaNum = document.getElementById("question-number");
        const elProblem = document.getElementById("problem");
        const elOpciones = document.getElementById("options-container");
        const elFeedback = document.getElementById("feedback");
        const elProgress = document.getElementById("progress-fill");
        const elStars = document.getElementById("m-stars");

        function generarProblema() {
            elFeedback.textContent = "";
            elPreguntaNum.textContent = `Paso ${aciertos + 1} de ${totalParaGanar}`;
            elProgress.style.width = `${(aciertos / totalParaGanar) * 100}%`;

            // Tablas del 2 al 10 con factores del 2 al 10
            num1 = Math.floor(Math.random() * 9) + 2;
            num2 = Math.floor(Math.random() * 9) + 2;
            respuestaCorrecta = num1 * num2;

            elProblem.textContent = `${num1} × ${num2}`;

            // Crear opciones (1 correcta y 3 falsas)
            let opciones = new Set([respuestaCorrecta]);
            while (opciones.size < 4) {
                let desvio = (Math.floor(Math.random() * 5) - 2) * num1;
                if (desvio === 0) desvio = num2;
                let opcionFalsa = respuestaCorrecta + desvio;
                if (opcionFalsa > 0 && opcionFalsa !== respuestaCorrecta) {
                    opciones.add(opcionFalsa);
                }
            }

            const opcionesArray = Array.from(opciones).sort(() => Math.random() - 0.5);

            elOpciones.innerHTML = "";
            opcionesArray.forEach(opt => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt;
                btn.onclick = () => verificarRespuesta(opt, btn);
                elOpciones.appendChild(btn);
            });
        }

        function verificarRespuesta(seleccion, boton) {
            const todosBotones = document.querySelectorAll(".option-btn");

            if (seleccion === respuestaCorrecta) {
                todosBotones.forEach(b => b.disabled = true);
                
                aciertos++;
                estrellasGanadas++;
                elStars.textContent = estrellasGanadas;
                
                elFeedback.className = "feedback-message feedback-correct";
                elFeedback.textContent = "✨ ¡Potencia al máximo! Multiplicación espacial impecable.";

                if (aciertos >= totalParaGanar) {
                    elProgress.style.width = "100%";
                    setTimeout(finalizarMision, 1000);
                } else {
                    setTimeout(generarProblema, 1000);
                }
            } else {
                boton.disabled = true;
                elFeedback.className = "feedback-message feedback-wrong";
                elFeedback.textContent = "❌ Error de potencia. ¡Revisa la tabla e inténtalo de nuevo!";
            }
        }

        function finalizarMision() {
            let data = {};
            try {
                const saved = localStorage.getItem("GAME_STATE") || localStorage.getItem("MISION_ESPACIAL_DATA");
                if (saved) data = JSON.parse(saved);
            } catch(e) {}

            data.stars = (data.stars || 0) + estrellasGanadas;
            data.points = (data.points || 0) + (estrellasGanadas * 50);

            // Marcar Misión 8 completada
            if (!data.completedMissions) data.completedMissions = [];
            if (!data.completedMissions.includes(MISSION_ID)) data.completedMissions.push(MISSION_ID);

            // Desbloquear Misión 9
            if (!data.unlockedMissions) data.unlockedMissions = [1, 2, 3, 4, 5, 6, 7, 8];
            if (!data.unlockedMissions.includes(9)) data.unlockedMissions.push(9);

            // Guardar progreso global
            localStorage.setItem("MISION_ESPACIAL_DATA", JSON.stringify(data));
            localStorage.setItem("GAME_STATE", JSON.stringify(data));

            alert(`🎉 ¡Misión 8 Completada!\nHas ganado ${estrellasGanadas} estrellas y desbloqueado la Misión 9.`);

            window.location.href = "map.html";
        }

        document.getElementById("btn-back").addEventListener("click", () => {
            window.location.href = "map.html";
        });

        generarProblema();
    </script>
</body>
</html>
