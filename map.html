<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Misiones Espaciales</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .map-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px 25px;
        }

        .title-section {
            text-align: center;
            margin: 30px 0;
        }

        .title-section h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .title-section p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.05rem;
        }

        /* CUADRÍCULA DE PLANETAS */
        .planets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .planet-card {
            padding: 25px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 320px;
            position: relative;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .planet-card:hover:not(.locked) {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 240, 255, 0.2);
        }

        .planet-card.completed {
            border-color: #00ff88;
        }

        .planet-card.unlocked {
            border-color: #00f0ff;
        }

        .planet-card.locked {
            opacity: 0.4;
            filter: grayscale(0.8);
        }

        .badge-completed {
            color: #00ff88;
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .planet-icon {
            font-size: 3.8rem;
            margin: 12px 0;
        }

        .planet-title {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn-mission {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }

        .btn-start {
            background: linear-gradient(90deg, #00f0ff, #7b2cbf);
            color: white;
        }

        .btn-review {
            background: linear-gradient(90deg, #00f0ff, #7b2cbf);
            color: white;
        }

        .btn-locked {
            background: rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
        }

        .btn-secondary-space {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    <div id="stars2-container"></div>

    <div class="app-container map-container">
        
        <header class="glassmorphism map-header">
            <button id="btn-home" class="btn-secondary-space" onclick="window.location.href='index.html'">🏠 Inicio</button>
            <div class="user-pill">🗺️ Mapa de Misiones</div>
            <div class="stat-pill">⭐ Total: <span id="total-stars">0</span></div>
        </header>

        <div class="title-section">
            <h1>Selecciona un Planeta</h1>
            <p>Completa cada misión para desbloquear la siguiente exploración.</p>
        </div>

        <div class="planets-grid" id="planets-container"></div>

    </div>

    <script>
        const misiones = [
            { id: 1, titulo: "Misión 1: Conociendo los Números", icono: "🪐", url: "mission1.html" },
            { id: 2, titulo: "Misión 2: Explorando el Conteo", icono: "🔴", url: "mission2.html" },
            { id: 3, titulo: "Misión 3: Comparando Planetas", icono: "🌌", url: "mission3.html" },
            { id: 4, titulo: "Misión 4: El Valor Posicional", icono: "🟢", url: "mission4.html" },
            { id: 5, titulo: "Misión 5: Sumas Espaciales", icono: "🚀", url: "mission5.html" },
            { id: 6, titulo: "Misión 6: Restas Intergalácticas", icono: "☄️", url: "mission6.html" },
            { id: 7, titulo: "Misión 7: Secuencias Cósmicas", icono: "⭐", url: "mission7.html" },
            { id: 8, titulo: "Misión 8: Multiplicación Estelar", icono: "🛸", url: "mission8.html" },
            { id: 9, titulo: "Misión 9: Divisiones Orbitales", icono: "🛰️", url: "mission9.html" },
            { id: 10, titulo: "Misión 10: Fracciones Lunares", icono: "🌙", url: "mission10.html" },
            { id: 11, titulo: "Misión 11: Desafío Final Galáctico", icono: "🏆", url: "mission11.html" }
        ];

        function renderizarMapa() {
            let data = { stars: 0, completedMissions: [1, 2, 3], unlockedMissions: [1, 2, 3, 4] };
            
            try {
                const saved = localStorage.getItem("GAME_STATE") || localStorage.getItem("MISION_ESPACIAL_DATA");
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed.stars !== undefined) data.stars = parsed.stars;
                    if (parsed.completedMissions) data.completedMissions = parsed.completedMissions;
                    if (parsed.unlockedMissions) data.unlockedMissions = parsed.unlockedMissions;
                }
            } catch(e) {
                console.error("Error al leer el estado del juego:", e);
            }

            document.getElementById("total-stars").textContent = data.stars;
            const container = document.getElementById("planets-container");
            container.innerHTML = "";

            misiones.forEach(m => {
                const esCompletada = data.completedMissions.includes(m.id);
                const esDesbloqueada = data.unlockedMissions.includes(m.id) || m.id === 1;

                const card = document.createElement("div");
                let estadoClass = "locked";
                if (esCompletada) estadoClass = "completed";
                else if (esDesbloqueada) estadoClass = "unlocked";

                card.className = `glassmorphism planet-card ${estadoClass}`;

                let html = esCompletada ? `<div class="badge-completed">✓ COMPLETADA</div>` : `<div style="height:21px;"></div>`;
                html += `<div class="planet-icon">${m.icono}</div>`;
                html += `<div class="planet-title">${m.titulo}</div>`;

                if (esCompletada) {
                    html += `<button class="btn-mission btn-review" onclick="window.location.href='${m.url}'">Revisar Misión 🚀</button>`;
                } else if (esDesbloqueada) {
                    html += `<button class="btn-mission btn-start" onclick="window.location.href='${m.url}'">Iniciar Misión 🚀</button>`;
                } else {
                    html += `<button class="btn-mission btn-locked" disabled>🔒 Bloqueada</button>`;
                }

                card.innerHTML = html;
                container.appendChild(card);
            });
        }

        // Ejecutar al cargar la página
        document.addEventListener("DOMContentLoaded", renderizarMapa);
        renderizarMapa();
    </script>
</body>
</html>
