<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Misiones Espaciales</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .map-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .map-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px 25px;
        }

        .missions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .mission-card {
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Estado: Bloqueado */
        .mission-card.locked {
            opacity: 0.5;
            filter: grayscale(0.8);
            cursor: not-allowed;
        }

        /* Estado: Desbloqueado */
        .mission-card.unlocked {
            opacity: 1;
            filter: none;
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            cursor: pointer;
        }

        .mission-card.unlocked:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
        }

        /* Estado: Completado */
        .mission-card.completed {
            border-color: #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .mission-card.completed::after {
            content: "✓ COMPLETADA";
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #00ff88;
        }

        .planet-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        .mission-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ffffff;
        }

        .btn-start {
            margin-top: 15px;
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        .btn-locked {
            background: rgba(255, 255, 255, 0.1);
            color: #888;
            cursor: not-allowed;
        }

        .btn-active {
            background: linear-gradient(90deg, #00f0ff, #7b2cbf);
            color: white;
        }

        .btn-secondary-space {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    <div id="stars2-container"></div>

    <div class="app-container map-container">
        
        <!-- Header con Estadísticas -->
        <header class="glassmorphism map-header">
            <button id="btn-home" class="btn-secondary-space">🏠 Inicio</button>
            <div class="user-pill">🗺️ Mapa de Misiones</div>
            <div class="stat-pill">⭐ Total: <span id="total-stars">0</span></div>
        </header>

        <h1 style="text-align: center; margin-bottom: 10px; color: white;">Selecciona un Planeta</h1>
        <p style="text-align: center; color: #aaa; margin-bottom: 30px;">Completa cada misión para desbloquear la siguiente exploración.</p>

        <!-- Grid con las Misiones -->
        <div class="missions-grid">
            
            <!-- Misión 1 -->
            <div class="glassmorphism mission-card locked" id="card-m1">
                <div class="planet-icon">🪐</div>
                <div class="mission-title">Misión 1: Conociendo los Números</div>
                <button class="btn-start btn-locked" id="btn-m1" disabled>🔒 Bloqueada</button>
            </div>

            <!-- Misión 2 -->
            <div class="glassmorphism mission-card locked" id="card-m2">
                <div class="planet-icon">🔴</div>
                <div class="mission-title">Misión 2: Explorando el Conteo</div>
                <button class="btn-start btn-locked" id="btn-m2" disabled>🔒 Bloqueada</button>
            </div>

            <!-- Misión 3 -->
            <div class="glassmorphism mission-card locked" id="card-m3">
                <div class="planet-icon">🌌</div>
                <div class="mission-title">Misión 3: Sumas Espaciales</div>
                <button class="btn-start btn-locked" id="btn-m3" disabled>🔒 Bloqueada</button>
            </div>

        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. Obtener los datos guardados
            let data = {};
            try {
                const saved = localStorage.getItem("GAME_STATE") || localStorage.getItem("MISION_ESPACIAL_DATA");
                if (saved) data = JSON.parse(saved);
            } catch(e) {}

            // Valores predeterminados si es la primera vez que juega
            const unlocked = data.unlockedMissions || [1];
            const completed = data.completedMissions || [];
            const stars = data.stars || 0;

            // Actualizar total de estrellas en pantalla
            document.getElementById("total-stars").textContent = stars;

            // Definición de las misiones disponibles
            const misiones = [
                { id: 1, card: "card-m1", btn: "btn-m1", file: "mission1.html" },
                { id: 2, card: "card-m2", btn: "btn-m2", file: "mission2.html" },
                { id: 3, card: "card-m3", btn: "btn-m3", file: "mission3.html" }
            ];

            // 2. Renderizar el estado de cada planeta/misión
            misiones.forEach(m => {
                const cardEl = document.getElementById(m.card);
                const btnEl = document.getElementById(m.btn);

                const isUnlocked = unlocked.includes(m.id);
                const isCompleted = completed.includes(m.id);

                if (isUnlocked) {
                    cardEl.classList.remove("locked");
                    cardEl.classList.add("unlocked");
                    btnEl.classList.remove("btn-locked");
                    btnEl.classList.add("btn-primary-space", "btn-active");
                    btnEl.removeAttribute("disabled");
                    btnEl.textContent = isCompleted ? "Revisar Misión 🚀" : "Iniciar Misión 🚀";

                    // Al hacer clic lleva a la misión
                    cardEl.onclick = () => {
                        window.location.href = m.file;
                    };
                }

                if (isCompleted) {
                    cardEl.classList.add("completed");
                }
            });

            // Botón Inicio
            document.getElementById("btn-home").addEventListener("click", () => {
                window.location.href = "index.html";
            });
        });
    </script>
</body>
</html>
