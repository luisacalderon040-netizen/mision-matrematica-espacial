<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 11: Gran FINAL de Recorrido Galáctico</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080c1d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Fondo Espacial */
        .stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at bottom, #111a2e 0%, #05070e 100%);
            z-index: 1;
        }

        /* Confeti Espacial */
        #confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }

        .game-card {
            background: #0f1530;
            border: 1px solid #1a234a;
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.4s ease;
        }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background-color: #1a2244;
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 33%;
            background: linear-gradient(90deg, #ff007a, #00f0ff);
            transition: width 0.4s ease;
        }

        .step-tag {
            color: #00f0ff;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .math-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed #2d386b;
            border-radius: 12px;
            padding: 15px;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .math-box span.red { color: #ff3366; }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #182046;
            border: 1px solid #2a366f;
            color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: #222d61;
            border-color: #00f0ff;
        }

        .option-btn.selected-correct {
            background: #800e58;
            border: 2px solid #ff007a;
            box-shadow: 0 0 15px rgba(255, 0, 122, 0.4);
        }

        .feedback-text {
            color: #00ff88;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            min-height: 22px;
        }

        /* Botón de Acción Principal (Estilo Captura) */
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #00f0ff, #8b2cf5);
            color: white;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.6);
        }

        .hidden { display: none !important; }

        /* Estilos y Animación de la Tarjeta Final */
        .celebrate-card {
            animation: zoomInSpace 0.75s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border: 1px solid rgba(0, 240, 255, 0.35);
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.2);
        }

        @keyframes zoomInSpace {
            0% {
                opacity: 0;
                transform: scale(0.65) translateY(40px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .trophy-container {
            margin-bottom: 15px;
            display: inline-block;
            animation: floatTrophy 3s ease-in-out infinite;
        }

        .trophy-icon {
            font-size: 80px;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.6));
        }

        @keyframes floatTrophy {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .victory-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .capture-quote {
            color: #d0d7f0;
            font-size: 16px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .user-welcome {
            font-size: 15px;
            color: #00f0ff;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stats-badge-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-badge span {
            color: #ffd700;
        }

        .farewell-text {
            color: #a0aec0;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .code-tag {
            display: inline-block;
            margin-top: 6px;
            color: #00f0ff;
            font-weight: bold;
            letter-spacing: 2px;
            background: rgba(0, 240, 255, 0.1);
            padding: 2px 10px;
            border-radius: 6px;
            border: 1px solid rgba(0, 240, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="stars-bg"></div>
    <div id="confetti-container"></div>

    <div class="game-card" id="main-card">
        
        <!-- Vista del Quiz -->
        <div id="quiz-view">
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div id="step-tag" class="step-tag">PREGUNTA 1 DE 3</div>
            <h2 id="question-text" class="question-title">Cargando...</h2>

            <div id="math-box" class="math-box"></div>

            <div id="options-grid" class="options-grid"></div>

            <div id="feedback" class="feedback-text"></div>

            <button id="next-btn" class="action-btn hidden" onclick="siguienteAccion()">Siguiente 🚀</button>
        </div>

        <!-- Vista de Finalización / Celebración -->
        <div id="victory-view" class="hidden">
            <div class="trophy-container">
                <div class="trophy-icon">🏆✨</div>
            </div>

            <!-- Título idéntico a la captura -->
            <h2 class="victory-title">¡RECORRIDO COMPLETADO!</h2>
            
            <!-- Mensaje idéntico a la captura -->
            <p class="capture-quote">Has dominado la última frontera espacial. ¡Felicidades, Cadete!</p>

            <div class="user-welcome" id="user-display">👨‍🚀 Cadete Espacial</div>

            <!-- Datos de Usuario (Estrellas + Puntos) -->
            <div class="stats-badge-container">
                <div class="stat-badge">⭐ Estrellas: <span id="final-stars">0</span></div>
                <div class="stat-badge">🏆 Puntos: <span id="final-points">0</span></div>
            </div>

            <!-- Mensaje personalizado + Código -->
            <p class="farewell-text">
                ¡Gracias por jugar! Te vemos en otra aventura galáctica.<br>
                <span class="code-tag">GAKAVCTCA 🛸⭐</span>
            </p>

            <!-- Botón de retorno exacto a la captura -->
            <button class="action-btn" onclick="volverAlMapa()">Volver al Mapa Principal 🚀</button>
        </div>

    </div>

    <script src="script.js"></script>
    <script>
        const preguntas = [
            {
                tag: "PREGUNTA 1 DE 3",
                progreso: "33%",
                pregunta: "Si una nave recorre 250 km y luego 350 km más, ¿cuántos km recorrió en total?",
                formula: "🛸 250 + 350 = <span class='red'>?</span>",
                opciones: ["500 km", "600 km", "550 km", "650 km"],
                correcta: 1
            },
            {
                tag: "PREGUNTA 2 DE 3",
                progreso: "66%",
                pregunta: "El radar detecta 3 hileras de 9 estrellas fugaces. ¿Cuántas estrellas fugaces hay en total?",
                formula: "🌠 3 × 9 = <span class='red'>?</span>",
                opciones: ["24 estrellas", "27 estrellas", "30 estrellas", "18 estrellas"],
                correcta: 1
            },
            {
                tag: "PREGUNTA 3 DE 3",
                progreso: "100%",
                pregunta: "Para completar el viaje, redondea el número 48 a la decena más cercana:",
                formula: "🎯 48 ≈ <span class='red'>?</span>",
                opciones: ["40", "45", "50", "60"],
                correcta: 2
            }
        ];

        let indice = 0;
        let respondido = false;
        let estrellasMision = 3;

        function cargarPregunta() {
            respondido = false;
            const q = preguntas[indice];

            document.getElementById("step-tag").innerText = q.tag;
            document.getElementById("progress-bar").style.width = q.progreso;
            document.getElementById("question-text").innerText = q.pregunta;
            document.getElementById("math-box").innerHTML = q.formula;
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-btn").classList.add("hidden");

            const grid = document.getElementById("options-grid");
            grid.innerHTML = "";

            q.opciones.forEach((opcion, i) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opcion;
                btn.onclick = () => seleccionar(i, btn);
                grid.appendChild(btn);
            });
        }

        function seleccionar(indexSeleccionado, elementoBtn) {
            if (respondido) return;

            const q = preguntas[indice];
            const feedback = document.getElementById("feedback");
            const nextBtn = document.getElementById("next-btn");

            if (indexSeleccionado === q.correcta) {
                respondido = true;
                elementoBtn.classList.add("selected-correct");
                feedback.innerText = "✨ ¡Brillante! Respuesta digna de un maestro espacial.";

                if (indice === preguntas.length - 1) {
                    nextBtn.innerText = "Completar Juego 🏆";
                } else {
                    nextBtn.innerText = "Siguiente Pregunta 🚀";
                }
                nextBtn.classList.remove("hidden");
            } else {
                feedback.style.color = "#ff3366";
                feedback.innerText = "Coordenada incorrecta. ¡Inténtalo de nuevo! 🛸";
                setTimeout(() => {
                    feedback.style.color = "#00ff88";
                    feedback.innerText = "";
                }, 1500);
            }
        }

        function siguienteAccion() {
            indice++;
            if (indice < preguntas.length) {
                cargarPregunta();
            } else {
                // Transición a la pantalla final
                document.getElementById("quiz-view").classList.add("hidden");
                
                const victoryView = document.getElementById("victory-view");
                const mainCard = document.getElementById("main-card");
                
                victoryView.classList.remove("hidden");
                mainCard.classList.add("celebrate-card");

                lanzarConfetiEspacial();
                guardarYMostrarProgreso();
            }
        }

        function lanzarConfetiEspacial() {
            const container = document.getElementById("confetti-container");
            const colores = ["#00f0ff", "#ffd700", "#ff007a", "#7b2cbf", "#00ff88", "#ffffff"];

            for (let i = 0; i < 70; i++) {
                const confetti = document.createElement("div");
                confetti.className = "confetti";
                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
                confetti.style.animationDelay = (Math.random() * 2) + "s";
                confetti.style.boxShadow = `0 0 6px ${confetti.style.backgroundColor}`;
                container.appendChild(confetti);
            }
        }

        function guardarYMostrarProgreso() {
            let state = {
                username: "Cadete Espacial",
                stars: 0,
                points: 0,
                completedMissions: [],
                unlockedMissions: [1]
            };

            try {
                const saved = localStorage.getItem("GAME_STATE") || localStorage.getItem("MISION_ESPACIAL_DATA");
                if (saved) {
                    state = Object.assign(state, JSON.parse(saved));
                }

                // Sumar puntos y estrellas obtenidas
                state.stars = (state.stars || 0) + estrellasMision;
                state.points = (state.points || 0) + (estrellasMision * 50);

                if (!state.completedMissions.includes(11)) {
                    state.completedMissions.push(11);
                }

                const dataString = JSON.stringify(state);
                localStorage.setItem("GAME_STATE", dataString);
                localStorage.setItem("MISION_ESPACIAL_DATA", dataString);

            } catch (e) {
                console.log("Progreso guardado.");
            }

            // Mostrar nombre, estrellas y puntos
            document.getElementById("user-display").innerText = `👨‍🚀 ${state.username || "Cadete Espacial"}`;
            document.getElementById("final-stars").innerText = state.stars;
            document.getElementById("final-points").innerText = state.points;
        }

        function volverAlMapa() {
            window.location.href = "index.html"; 
        }

        // Iniciar
        cargarPregunta();
    </script>
</body>
</html>
