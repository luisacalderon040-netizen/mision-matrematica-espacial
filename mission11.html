<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 11: Gran FINAL de Recorrido Galáctico</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f26;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Contenedor de Confeti */
        #confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0;
            }
        }

        .game-card {
            background: rgba(18, 24, 56, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 24px;
            padding: 35px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
            text-align: center;
            position: relative;
            z-index: 10;
            transition: all 0.5s ease;
        }

        .game-card.celebrate-card {
            border: 2px solid #ffd700;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.4), inset 0 0 20px rgba(255, 215, 0, 0.2);
        }

        .progress-bar-container {
            width: 100%;
            height: 12px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 33%;
            background: linear-gradient(90deg, #ff007a, #00f0ff);
            transition: width 0.4s ease;
            box-shadow: 0 0 10px #00f0ff;
        }

        .step-tag {
            color: #00f0ff;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .math-box {
            background: rgba(255, 255, 255, 0.04);
            border: 1px dashed #2d386b;
            border-radius: 12px;
            padding: 15px;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .math-box span.red {
            color: #ff3366;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: #00f0ff;
            transform: translateY(-2px);
        }

        .option-btn.selected-correct {
            background: #800e58;
            border: 2px solid #ff007a;
            box-shadow: 0 0 15px rgba(255, 0, 122, 0.4);
        }

        .feedback-text {
            color: #00ff88;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 20px;
            min-height: 22px;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #00f0ff, #7b2cbf);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .action-btn-gold {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000000;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.5);
        }

        .action-btn:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }

        .hidden {
            display: none !important;
        }

        /* Animaciones para la celebración */
        .trophy-icon {
            font-size: 80px;
            margin-bottom: 15px;
            display: inline-block;
            animation: floatTrophy 2.5s ease-in-out infinite;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.6));
        }

        @keyframes floatTrophy {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }

        .victory-title {
            font-size: 26px;
            color: #ffd700;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
            margin-bottom: 15px;
        }

        .farewell-text {
            font-size: 18px;
            line-height: 1.6;
            color: #ffffff;
            margin-bottom: 30px;
        }

        .code-tag {
            display: inline-block;
            margin-top: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
            background: rgba(0, 240, 255, 0.1);
            padding: 4px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- Contenedor para el confeti espacial -->
    <div id="confetti-container"></div>

    <div class="game-card" id="main-card">
        
        <!-- Vista del Quiz -->
        <div id="quiz-view">
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>

            <div id="step-tag" class="step-tag">PREGUNTA 1 DE 3</div>
            <h2 id="question-text" class="question-title">Cargando...</h2>

            <div id="math-box" class="math-box"></div>

            <div id="options-grid" class="options-grid"></div>

            <div id="feedback" class="feedback-text"></div>

            <button id="next-btn" class="action-btn hidden" onclick="siguienteAccion()">Siguiente 🚀</button>
        </div>

        <!-- Vista de Finalización / Celebración Espacial -->
        <div id="victory-view" class="hidden">
            <div class="trophy-icon">🏆✨</div>
            <h2 class="victory-title">¡RECORRIDO COMPLETADO!</h2>
            
            <p class="farewell-text">
                ¡Gracias por jugar! Te vemos pronto en otra aventura.<br>
                <span class="code-tag">GAKAVCTCA 🛸⭐</span>
            </p>

            <button class="action-btn action-btn-gold" onclick="volverAlMapa()">Volver al Mapa Principal 🚀</button>
        </div>

    </div>

    <script src="script.js"></script>
    <script>
        const preguntas = [
            {
                tag: "PREGUNTA 1 DE 3",
                progreso: "33%",
                pregunta: "Si una nave recorre 250 km y luego 350 km más, ¿cuántos km recorrió en total?",
                formula: "🛸 250 + 350 = <span class='red'>?</span>",
                opciones: ["500 km", "600 km", "550 km", "650 km"],
                correcta: 1
            },
            {
                tag: "PREGUNTA 2 DE 3",
                progreso: "66%",
                pregunta: "El radar detecta 3 hileras de 9 estrellas fugaces. ¿Cuántas estrellas fugaces hay en total?",
                formula: "🌠 3 × 9 = <span class='red'>?</span>",
                opciones: ["24 estrellas", "27 estrellas", "30 estrellas", "18 estrellas"],
                correcta: 1
            },
            {
                tag: "PREGUNTA 3 DE 3",
                progreso: "100%",
                pregunta: "Para completar el viaje, redondea el número 48 a la decena más cercana:",
                formula: "🎯 48 ≈ <span class='red'>?</span>",
                opciones: ["40", "45", "50", "60"],
                correcta: 2
            }
        ];

        let indice = 0;
        let respondido = false;

        function cargarPregunta() {
            respondido = false;
            const q = preguntas[indice];

            document.getElementById("step-tag").innerText = q.tag;
            document.getElementById("progress-bar").style.width = q.progreso;
            document.getElementById("question-text").innerText = q.pregunta;
            document.getElementById("math-box").innerHTML = q.formula;
            document.getElementById("feedback").innerText = "";
            document.getElementById("next-btn").classList.add("hidden");

            const grid = document.getElementById("options-grid");
            grid.innerHTML = "";

            q.opciones.forEach((opcion, i) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerText = opcion;
                btn.onclick = () => seleccionar(i, btn);
                grid.appendChild(btn);
            });
        }

        function seleccionar(indexSeleccionado, elementoBtn) {
            if (respondido) return;

            const q = preguntas[indice];
            const feedback = document.getElementById("feedback");
            const nextBtn = document.getElementById("next-btn");

            if (indexSeleccionado === q.correcta) {
                respondido = true;
                elementoBtn.classList.add("selected-correct");
                feedback.innerText = "✨ ¡Brillante! Respuesta digna de un maestro espacial.";

                if (indice === preguntas.length - 1) {
                    nextBtn.innerText = "Completar Juego 🏆";
                } else {
                    nextBtn.innerText = "Siguiente Pregunta 🚀";
                }
                nextBtn.classList.remove("hidden");
            } else {
                feedback.style.color = "#ff3366";
                feedback.innerText = "Coordenada incorrecta. ¡Inténtalo de nuevo! 🛸";
                setTimeout(() => {
                    feedback.style.color = "#00ff88";
                    feedback.innerText = "";
                }, 1500);
            }
        }

        function siguienteAccion() {
            indice++;
            if (indice < preguntas.length) {
                cargarPregunta();
            } else {
                // Mostrar pantalla final con celebración
                document.getElementById("quiz-view").classList.add("hidden");
                document.getElementById("victory-view").classList.remove("hidden");
                document.getElementById("main-card").classList.add("celebrate-card");
                
                lanzarConfetiEspacial();
                guardarProgreso();
            }
        }

        // Genera destellos y confeti de colores espaciales
        function lanzarConfetiEspacial() {
            const container = document.getElementById("confetti-container");
            const colores = ["#00f0ff", "#ffd700", "#ff007a", "#7b2cbf", "#00ff88", "#ffffff"];

            for (let i = 0; i < 70; i++) {
                const confetti = document.createElement("div");
                confetti.className = "confetti";
                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.backgroundColor = colores[Math.floor(Math.random() * colores.length)];
                confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
                confetti.style.animationDelay = (Math.random() * 2) + "s";
                confetti.style.boxShadow = `0 0 8px ${confetti.style.backgroundColor}`;
                container.appendChild(confetti);
            }
        }

        function guardarProgreso() {
            try {
                let state = { completedMissions: [], unlockedMissions: [1] };
                const saved = localStorage.getItem("GAME_STATE") || localStorage.getItem("MISION_ESPACIAL_DATA");
                
                if (saved) {
                    state = Object.assign(state, JSON.parse(saved));
                }

                if (!state.completedMissions.includes(11)) {
                    state.completedMissions.push(11);
                }

                const dataString = JSON.stringify(state);
                localStorage.setItem("GAME_STATE", dataString);
                localStorage.setItem("MISION_ESPACIAL_DATA", dataString);
            } catch (e) {
                console.log("Progreso guardado correctamente.");
            }
        }

        function volverAlMapa() {
            window.location.href = "map.html"; 
        }

        // Iniciar juego
        cargarPregunta();
    </script>
</body>
</html>
