<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión Matemática Espacial</title>
    <link rel="stylesheet" href="style.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f26;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .main-card {
            background: #121838;
            border: 1px solid #1e295d;
            border-radius: 20px;
            padding: 35px 25px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.15);
            text-align: center;
        }

        .rocket-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .subtitle-cyan {
            color: #00f0ff;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
        }

        .slogan {
            color: #a0aec0;
            font-size: 13px;
            font-style: italic;
            margin-bottom: 25px;
        }

        .input-group {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #1e295d;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        .avatar-box {
            background: #182046;
            border-radius: 50%;
            padding: 8px;
            font-size: 24px;
        }

        .input-label {
            color: #00f0ff;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .player-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid #00f0ff;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            outline: none;
            padding-bottom: 4px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 25px;
        }

        .stat-badge {
            background: #182046;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .start-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #00f0ff, #7b2cbf);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .start-btn:hover {
            transform: scale(1.02);
            opacity: 0.95;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="rocket-icon">🚀</div>
        <h1>MISIÓN MATEMÁTICA</h1>
        <div class="subtitle-cyan">ESPACIAL</div>
        <p class="slogan">"Explora el universo. Resuelve desafíos. Conquista las matemáticas."</p>

        <div class="input-group">
            <div class="avatar-box">👨‍🚀</div>
            <div style="width: 100%;">
                <div class="input-label">NOMBRE DEL CADETE ESPACIAL:</div>
                <input type="text" id="playerName" class="player-input" value="Explorador">
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-badge">⭐ <span id="starsCount">0</span> Estrellas</div>
            <div class="stat-badge">🏆 <span id="pointsCount">0</span> Puntos</div>
        </div>

        <button type="button" class="start-btn" onclick="iniciarAventura()">COMENZAR AVENTURA 🚀</button>
    </div>

    <script src="script.js"></script>
    <script>
        // Cargar datos previos si existen al abrir la página
        window.addEventListener("DOMContentLoaded", function() {
            try {
                const savedData = localStorage.getItem("GAME_STATE") || localStorage.getItem("MISION_ESPACIAL_DATA");
                if (savedData) {
                    const state = JSON.parse(savedData);
                    
                    const nameInput = document.getElementById("playerName");
                    if (nameInput && (state.playerName || state.username)) {
                        nameInput.value = state.playerName || state.username;
                    }
                    
                    const starsEl = document.getElementById("starsCount");
                    if (starsEl) starsEl.innerText = state.stars || 0;
                    
                    const pointsEl = document.getElementById("pointsCount");
                    if (pointsEl) pointsEl.innerText = state.points || 0;
                }
            } catch (e) {
                console.warn("No se pudo recuperar el estado inicial del juego:", e);
            }
        });

        // Guardar nombre e iniciar la primera misión
        function iniciarAventura() {
            const nombreIngresado = document.getElementById("playerName").value.trim() || "Explorador";

            let state = {
                playerName: nombreIngresado,
                username: nombreIngresado,
                avatar: "👨‍🚀",
                stars: 0,
                points: 0,
                unlockedMissions: [1],
                completedMissions: []
            };

            // Intentar combinar con datos previos existentes si los hay
            try {
                const savedData = localStorage.getItem("GAME_STATE") || localStorage.getItem("MISION_ESPACIAL_DATA");
                if (savedData) {
                    const parsed = JSON.parse(savedData);
                    state = { ...state, ...parsed };
                    state.playerName = nombreIngresado;
                    state.username = nombreIngresado;
                }
            } catch (e) {
                console.warn("Creando un estado de juego nuevo");
            }

            // Asegurar campos esenciales
            if (!Array.isArray(state.unlockedMissions) || state.unlockedMissions.length === 0) {
                state.unlockedMissions = [1];
            }
            if (!Array.isArray(state.completedMissions)) {
                state.completedMissions = [];
            }

            // Guardar sincronizado en ambas claves de almacenamiento
            localStorage.setItem("GAME_STATE", JSON.stringify(state));
            localStorage.setItem("MISION_ESPACIAL_DATA", JSON.stringify(state));

            // Redirigir a la primera misión
            window.location.href = "mission1.html";
        }
    </script>
</body>
</html>
