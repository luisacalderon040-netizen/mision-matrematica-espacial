<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misión 1: Conociendo los Números</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .mission-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .mission-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 15px 25px;
        }

        .progress-bar-container {
            width: 100%;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
            border: 1px solid var(--glass-border, rgba(255,255,255,0.1));
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f0ff, #7b2cbf);
            transition: width 0.4s ease;
            box-shadow: 0 0 10px #00f0ff;
        }

        .question-card {
            padding: 30px;
            margin-bottom: 20px;
            text-align: center;
        }

        .question-text {
            font-size: 1.4rem;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 15px;
            border-radius: 14px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: #00f0ff;
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background: rgba(0, 240, 255, 0.3);
            border-color: #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .feedback-message {
            min-height: 30px;
            font-size: 1.1rem;
            font-weight: 700;
            margin: 15px 0;
        }

        .feedback-correct { color: #00ff88; text-shadow: 0 0 8px rgba(0, 255, 136, 0.5); }
        .feedback-wrong { color: #ff4d4d; text-shadow: 0 0 8px rgba(255, 77, 77, 0.5); }

        .btn-primary-space {
            background: linear-gradient(90deg, #00f0ff, #7b2cbf);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-secondary-space {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    <div id="stars2-container"></div>

    <div class="app-container mission-container">
        
        <!-- Header de la Misión -->
        <header class="glassmorphism mission-header">
            <!-- BOTÓN DIRIGIDO AL MAPA EN EL HTML -->
            <button id="btn-back" class="btn-secondary-space">🗺️ Volver al Mapa</button>
            <div class="user-pill">🪐 Misión 1: Conociendo los números</div>
            <div class="stat-pill">⭐ <span id="m-stars">0</span></div>
        </header>

        <!-- Barra de Progreso -->
        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>

        <!-- Tarjeta del Ejercicio -->
        <main class="glassmorphism question-card">
            <div class="planet-number" id="question-number">Pregunta 1 de 3</div>
            <h2 class="question-text" id="question-text">Cargando desafío espacial...</h2>

            <div class="options-grid" id="options-container"></div>

            <div class="feedback-message" id="feedback"></div>

            <button id="btn-action" class="btn-primary-space" style="margin-top: 15px;">Comprobar Respuesta 🚀</button>
        </main>

    </div>

    <script>
        const preguntas = [
            {
                texto: "¿Cuál de los siguientes números representa el número mil cuarenta y cinco?",
                opciones: ["1,045", "1,450", "10,045", "10,450"],
                correcta: 0
            },
            {
                texto: "En el número 3,582... ¿Qué valor ocupa el dígito 5?",
                opciones: ["Unidades", "Decenas", "Centenas", "Unidades de millar"],
                correcta: 2
            },
            {
                texto: "¿Qué número se forma con 4 Centenas, 2 Decenas y 9 Unidades?",
                opciones: ["4,209", "429", "249", "4,290"],
                correcta: 1
            }
        ];

        let indicePregunta = 0;
        let opcionSeleccionada = null;
        let estrellasGanadas = 0;

        const elPreguntaNum = document.getElementById("question-number");
        const elPreguntaTexto = document.getElementById("question-text");
        const elOpciones = document.getElementById("options-container");
        const elFeedback = document.getElementById("feedback");
        const elBtnAction = document.getElementById("btn-action");
        const elProgress = document.getElementById("progress-fill");

        function cargarPregunta() {
            opcionSeleccionada = null;
            elFeedback.textContent = "";
            elBtnAction.textContent = "Comprobar Respuesta 🚀";

            const p = preguntas[indicePregunta];
            elPreguntaNum.textContent = `Pregunta ${indicePregunta + 1} de ${preguntas.length}`;
            elPreguntaTexto.textContent = p.texto;
            elProgress.style.width = `${((indicePregunta) / preguntas.length) * 100}%`;

            elOpciones.innerHTML = "";
            p.opciones.forEach((op, idx) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = op;
                btn.onclick = () => seleccionarOpcion(idx, btn);
                elOpciones.appendChild(btn);
            });
        }

        function seleccionarOpcion(index, element) {
            document.querySelectorAll(".option-btn").forEach(b => b.classList.remove("selected"));
            element.classList.add("selected");
            opcionSeleccionada = index;
        }

        elBtnAction.addEventListener("click", () => {
            if (elBtnAction.textContent.includes("Siguiente") || elBtnAction.textContent.includes("Finalizar")) {
                indicePregunta++;
                if (indicePregunta < preguntas.length) {
                    cargarPregunta();
                } else {
                    finalizarMision();
                }
                return;
            }

            if (opcionSeleccionada === null) {
                elFeedback.className = "feedback-message feedback-wrong";
                elFeedback.textContent = "¡Selecciona una respuesta primero!";
                return;
            }

            const p = preguntas[indicePregunta];
            if (opcionSeleccionada === p.correcta) {
                estrellasGanadas++;
                document.getElementById("m-stars").textContent = estrellasGanadas;
                elFeedback.className = "feedback-message feedback-correct";
                elFeedback.textContent = "✨ ¡Correcto! Excelente cálculo espacial.";
            } else {
                elFeedback.className = "feedback-message feedback-wrong";
                elFeedback.textContent = "❌ Incorrecto. ¡Sigue intentándolo!";
            }

            elBtnAction.textContent = (indicePregunta + 1 < preguntas.length) ? "Siguiente Pregunta ➡" : "Finalizar Misión 🏆";
        });

        function finalizarMision() {
            elProgress.style.width = "100%";
            
            // Cargar estado previo
            let data = {};
            try {
                const saved = localStorage.getItem("GAME_STATE") || localStorage.getItem("MISION_ESPACIAL_DATA");
                if (saved) data = JSON.parse(saved);
            } catch(e) {}

            data.stars = (data.stars || 0) + estrellasGanadas;
            data.points = (data.points || 0) + (estrellasGanadas * 50);
            
            // Marcar Misión 1 completada
            if (!data.completedMissions) data.completedMissions = [];
            if (!data.completedMissions.includes(1)) data.completedMissions.push(1);

            // Desbloquear Misión 2
            if (!data.unlockedMissions) data.unlockedMissions = [1];
            if (!data.unlockedMissions.includes(2)) data.unlockedMissions.push(2);

            // Guardar progreso
            localStorage.setItem("MISION_ESPACIAL_DATA", JSON.stringify(data));
            localStorage.setItem("GAME_STATE", JSON.stringify(data));

            alert(`🎉 ¡Misión Completada!\nHas ganado ${estrellasGanadas} estrellas.`);
            
            // 📍 REDIRECCIÓN AL FINALIZAR: Va a map.html
            window.location.href = "map.html";
        }

        // 📍 REDIRECCIÓN AL HACER CLIC EN EL BOTÓN "VOLVER AL MAPA": Va a map.html
        document.getElementById("btn-back").addEventListener("click", () => {
            window.location.href = "map.html";
        });

        cargarPregunta();
    </script>
</body>
</html>
